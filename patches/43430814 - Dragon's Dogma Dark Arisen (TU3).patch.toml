title_name = "Dragon's Dogma: Dark Arisen" # TU3
title_id = "43430814" # CC-2068
hash = "D70485DF8B88645D" # Default.xex
#media_id = "0F61AFF2" # Game Disc (Disc 1)

[[patch]]
    name = "Remove Letterbox"
    desc = "The game renders the 3D scene into a 1280x608 viewport (56 px black bars). The bars are the main view rectangle (0,56,1280,664) that the engine derives from a screen aspect of 0.475 and stores into view slot 0 of its screen object; the map screen reads that rectangle back and hard-codes the 56 px bar offset in its own maths, so it only works with the letterboxed rectangle (the first version of this patch, which just changed the aspect constant, made the map auto-scroll and flicker whenever the cursor touched a location icon). This version forces the engine onto its native 16:9 branch (aspect 0.5625, no letterbox flag) for the viewport, FOV and HUD, keeps computing the letterbox rectangle from the untouched 0.475 constant but stores it into the unused view slot 7, and redirects the map/UI module reads of the main view rectangle to that slot, so the 3D scene fills the whole frame while the map keeps its original geometry and cursor magnet behaviour. The HUD offset code is left reading 0.475 on purpose: elements the map leaves unplaced sit at (0,0) and that -56 px offset keeps them off screen."
    author = "LuismaSP89"
    is_enabled = false

    # Aspect selection: always the native 16:9 branch (0.5625 into +0xd14, letterbox flag +0xd19 cleared)
    [[patch.be32]]
        address = 0x823cace8 # was 0x893f0d18 : aspect selection: lbz d18 -> li 0 (always 0.5625, d19=0)
        value = 0x39200000

    [[patch.be32]]
        address = 0x823c8bdc # was 0x89430d18 : letterbox setter: lbz d18 -> li 0
        value = 0x39400000

    [[patch.be32]]
        address = 0x823cae6c # was 0xc00726f8 : event setup: 0.475 -> 0.5625
        value = 0xc0072700

    [[patch.be32]]
        address = 0x823cae70 # was 0x993f0d19 : event setup: no d19=1
        value = 0x60000000

    # View rectangle: still computed from the untouched 0.475 constant, but stored into the unused view slot 7 instead of the main slot 0
    [[patch.be32]]
        address = 0x823cad34 # was 0xfda00090 : selection path: view rect from 0.475 (letterbox) instead of the chosen aspect
        value = 0xc1a726f8

    [[patch.be32]]
        address = 0x823cad70 # was 0x38800000 : selection path: store that rect into view slot 7 instead of slot 0
        value = 0x38800007

    # Camera vertical FOV: 0.475 -> 0.5625
    [[patch.be32]]
        address = 0x8281d338 # was 0xc00926f8 : 0.475 -> 0.5625 (HUD offset / FOV consumers, as in v1)
        value = 0xc0092700

    # Map/UI module (0x826b0000-0x82700000): reads of the main view rectangle (+0x58/+0x5c/+0x60/+0x64 of the screen object) redirected to view slot 7 (+0xb48/+0xb4c/+0xb50/+0xb54)
    [[patch.be32]]
        address = 0x826bf38c # was 0x814b0058 : rect read 0x58 -> slot 7
        value = 0x814b0b48

