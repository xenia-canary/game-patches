[[patch]]
    name = "Infinite Health"
    desc = "Your party takes no damage. Enemies still take theirs."
    author = "peerloomllc"
    is_enabled = false

    # The damage store is shared with the enemies, so it branches to a few
    # spare bytes that skip it only when the character is one of yours
    # (0x40000000 at +0x90 of the character record).
    [[patch.be32]]
        address = 0x82b2b6a4
        value = 0x485dde2c        # b 0x831094d0, replacing stfs f0, 0xa1c(r30)
    [[patch.be32]]
        address = 0x831094d0
        value = 0x801e0090        # lwz r0, 0x90(r30)
    [[patch.be32]]
        address = 0x831094d4
        value = 0x74004000        # andis. r0, r0, 0x4000
    [[patch.be32]]
        address = 0x831094d8
        value = 0x40820008        # bne +8, one of ours: skip the store
    [[patch.be32]]
        address = 0x831094dc
        value = 0xd01e0a1c        # stfs f0, 0xa1c(r30)
    [[patch.be32]]
        address = 0x831094e0
        value = 0x4ba221c8        # b 0x82b2b6a8, back

