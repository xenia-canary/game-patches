# Two variants of the same patch. ENABLE ONLY ONE (they write the same addresses):
#   A) "60 FPS with Battles and Cutscenes fixed at 30": 60 fps in the field, 30 fps in cutscenes, 30 fps fixed for the whole battle (no mid-battle switches).
#   B) "60 FPS With battles at 60, (dialogue in battles and cutscenes at 30FPS)": 60 fps in the field and in battles, 30 fps in cutscenes and whenever a voiced dialogue window is shown (also in battle).
# Switch by setting is_enabled = true on one block and false on the other, then restart Xenia.

[[patch]]
    name = "60 FPS with Battles and Cutscenes fixed at 30"
    desc = "60 fps in exploration; 30 fps during cutscenes and battles"
    author = "Co-authored by peerloomllc & LuismaSP89"
    is_enabled = false

    # frame-rate table entry for gameplay: 30 -> 60
    [[patch.be8]]
        address = 0x8205e87c
        value = 0x3c

    # battle enter handler (scene type 3, "battle start" in PR 525): li r4,30 -> bl battle-enter stub (sets the in-battle word, r4 = 30)
    [[patch.be32]]
        address = 0x821ba640
        value = 0x4812db51

    # battle exit handler (scene type 3 exit): first instruction (mfspr r12,lr) -> b battle-exit stub (clears the in-battle word)
    [[patch.be32]]
        address = 0x821ba708
        value = 0x4812da9c

    # script AddPosition: branch to the icy-slope hook below
    [[patch.be32]]
        address = 0x820e91d0
        value = 0x481fee30

    # top of the frame loop: branch to the frame counter + frame-rate selection below
    [[patch.be32]]
        address = 0x82132a88
        value = 0x481b5660

    # data block: +0 frame counter, +4 scale for repeated pushes (0.45f), +0x14 saved LR, +0x44 in-battle word (set/cleared by the stubs)
    #   +0xc/+0x10  flag 1: script-VM event-mode byte == 1 -> 30 fps (set while a field cutscene runs)
    #   +0x18/+0x1c flag 2: message-window-active byte == 1 -> 30 fps (set while a voiced dialogue window is shown)
    #   +0x3c       battle frame rate (0x1e = 30, 0x3c = 60); keep equal to the li r4 in the battle-enter stub
    #   a flag address of 0 disables that check
    [[patch.be32]]
        address = 0x82568004
        value = 0x3ee66666
    [[patch.be32]]
        address = 0x8256800c
        value = 0x82440579
    [[patch.be32]]
        address = 0x82568010
        value = 0x00000001
