[[patch]]
    name = "60 FPS"
    desc = "60 fps in exploration, cutscenes and battles at normal game speed."
    author = "peerloomllc"
    is_enabled = false

    # frame-rate table entry for gameplay: 30 -> 60
    [[patch.be8]]
        address = 0x8202e5f4
        value = 0x3c

    # battle start: SetFrameRate(30) -> SetFrameRate(60)
    [[patch.be32]]
        address = 0x82179f70
        value = 0x3880003c

    # A map script pushes the player down the icy slope every frame. Scripts
    # run every frame at 60 fps, so the push came twice as often. A push for
    # the same script thread and object 1-2 frames after the previous one is
    # scaled to 0.45; other pushes (cutscene moves) are unchanged.

    # script AddPosition: branch to the code below
    [[patch.be32]]
        address = 0x820a90a8
        value = 0x481e8f58

    # top of the frame loop: branch to the frame counter below
    [[patch.be32]]
        address = 0x820f26a8
        value = 0x4819fa40

    # scale for repeated pushes: 0.45f
    [[patch.be32]]
        address = 0x824ef004
        value = 0x3ee66666

