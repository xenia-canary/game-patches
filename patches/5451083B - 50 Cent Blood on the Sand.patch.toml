[[patch]]
    name = "21:9 Ultrawide Aspect Ratio Support"
    desc = "Must set present_letterbox = FALSE in the xenia canary config. Expands gameplay rendering to true 21:9 ultrawide and updates the FOV axis constraint for proper framing, and adds pillarboxing for pre-rendered videos. HUD and UI elements will appear moderately stretched and cutscenes will be slightly cropped. Because the game now renders at 1280x550, certain elements may appear more aliased."
    author = "boma"
    is_enabled = false

