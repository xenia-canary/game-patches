title_name = "Bean (GoldenEye 007) Community Edition"
title_id = "584108A9" # XA-2217
hash = [
    "55FE9ECAB778EE4A", # defaultCE.xex (Community Edition, built from the modified default.xex)
    "49CAD59B32AB3217"  # defaultCE-surround.xex (Community Edition, 5.1 surround build)
]
#media_id = "00000000"

[[patch]]
    name = "Restore music"
    desc = "Restores three music features that were compiled out of this leaked build (its track fade system was also left as an empty stub, so Rare disabled all of them): 1) Dynamic X music - the boss/alarm 'energy tune' switch, e.g. Cradle X during the final Trevelyan fight (the AI 'enery tune on/off' commands only printed a debug line; now they stop the main track and drive the music state machine). 2) The 007 Watch Theme in the watch/pause menu - level and ambient music is paused via the real IXACTCue::Pause and resumes exactly where it left off when the watch is closed (X music restarts, as it also did on the N64). 3) Main menu music after finishing or quitting a mission - the frontend only armed its menu music on boot, now it checks whether the menu tune is actually playing on track 0 and restarts it if not. Code stubs live in .text tail padding (0x824103A0-0x82411104), saved state in .data padding (0x830CC340)."
    author = "LuismaSP89"
    is_enabled = false

